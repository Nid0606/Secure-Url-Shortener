<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Redirector | Gatekeeper</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image:
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.17) 0px, rgba(255, 255, 255, 0.15) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.17)  0px, rgba(255, 255, 255, 0.15) 1px, transparent 1px, transparent 40px);
        }
        h2{
            color:#ffffff;
            margin-bottom: 15px;
            text-shadow:
                0 0 10px rgba(255,255,255, 0.15),
                0 0 20px rgba(255, 255, 255, 0.15);

        }
        .card {

            background: rgb(39, 39, 39);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5), 0 4px 12px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 2px solid rgba(37, 99, 235, 0.6);;
        }
        .warning-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .url-box {
            background: #f8f9fa;
            border: 1px dashed #007bff;
            padding: 12px;
            word-break: break-all;
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
            border-radius: 4px;
        }
        .btn-proceed {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-proceed:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚠️ Security Check</h2>
    <p id="statusMsg" style="color: #666; font-style: italic;">Verifying destination link details with backend...</p>
    
    <div id="redirectContent" style="display: none;">
        <div class="warning-box">Hold on! You are being redirected.</div>
        <p>This shortened link points to the following destination:</p>
        <div class="url-box" id="unmaskedUrl"></div>
        <p>Verify this address is safe before proceeding.</p>
        <a href="#" id="confirmProceedBtn" class="btn-proceed">Proceed to Website</a>
    </div>
</div>

<script>
    const BACKEND_BASE = 'https://secure-url-shortener-b6nj.onrender.com';

    const statusMsg = document.getElementById('statusMsg');
    const redirectContent = document.getElementById('redirectContent');
    const unmaskedUrl = document.getElementById('unmaskedUrl');
    const confirmProceedBtn = document.getElementById('confirmProceedBtn');

    const hostname = window.location.hostname;
    let shortCodeParam = null;

    const urlParams = new URLSearchParams(window.location.search);
    shortCodeParam = urlParams.get('code');

    if (!shortCodeParam) {
        const cleanHostname = hostname.replace(/^www\./, '');
        const parts = cleanHostname.split('.');
        if (parts.length > 2 && parts[0] !== 'n06') {
            shortCodeParam = parts[0];
        }
    }

    if (!shortCodeParam) {
        statusMsg.style.color = '#dc3545';
        statusMsg.textContent = "Error: No short code provided.";
    } 
    else {
        fetch(`${BACKEND_BASE}/api/redirect/${shortCodeParam}`)
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.message || err.error) });
                }
                return res.json();
            })
            .then(data => {
                statusMsg.style.display = 'none';
                unmaskedUrl.textContent = data.long_url;
                confirmProceedBtn.onclick = (e) => {
                    e.preventDefault();
                    window.location.href = data.long_url;
                };
                redirectContent.style.display = 'block';
            })
            .catch(err => {
                statusMsg.style.color = '#dc3545';
                statusMsg.style.fontWeight = 'bold';
                statusMsg.textContent = `Error: ${err.message || "Failed to fetch link details."}`;
            });
    }
</script>
</body>
</html>
